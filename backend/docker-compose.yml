version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: smartbus_user
      POSTGRES_PASSWORD: smartbus_password
      POSTGRES_DB: smartbus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbus_user -d smartbus_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/smartbus_db
      - DATABASE_USERNAME=smartbus_user
      - DATABASE_PASSWORD=smartbus_password
      - JWT_SECRET=this_is_a_very_secure_and_long_jwt_secret_for_smartbus_256_bits!
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
